# SonarQube Cloud — https://sonarcloud.io/project/overview?id=someoneinthe_dishes-cook
sonar.organization=shell-aliases
sonar.projectKey=someoneinthe_dishes-cook
sonar.projectName=Dishes Cook

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
# Route files only re-export screens; keep them out of coverage like jest.config.js does.
sonar.coverage.exclusions=src/app/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
