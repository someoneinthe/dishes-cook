# SonarQube Cloud — https://sonarcloud.io/project/overview?id=someoneinthe_dishes-cook
sonar.organization=shell-aliases
sonar.projectKey=someoneinthe_dishes-cook
sonar.projectName=Dishes Cook

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
# Route files only re-export screens; keep them out of coverage like jest.config.js does.
sonar.coverage.exclusions=src/app/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Rules disabled because they conflict with the project's tooling or don't fit the stack.
sonar.issue.ignore.multicriteria=arrowParens,shorthandFirst,aliasImports,routeFileNames
# Prettier always writes `(x) => …` (arrowParens: "always").
sonar.issue.ignore.multicriteria.arrowParens.ruleKey=typescript:S3524
sonar.issue.ignore.multicriteria.arrowParens.resourceKey=**/*
# perfectionist sorts object keys alphabetically, shorthand or not.
sonar.issue.ignore.multicriteria.shorthandFirst.ruleKey=typescript:S3499
sonar.issue.ignore.multicriteria.shorthandFirst.resourceKey=**/*
# `@/…` path aliases (tsconfig paths) are reported as missing packages; TypeScript and ESLint
# (import/no-unresolved) already check every import.
sonar.issue.ignore.multicriteria.aliasImports.ruleKey=typescript:S4328
sonar.issue.ignore.multicriteria.aliasImports.resourceKey=**/*
# Expo Router requires its file names (`_layout.tsx`, `index.tsx`), whatever the export is called.
sonar.issue.ignore.multicriteria.routeFileNames.ruleKey=typescript:S3317
sonar.issue.ignore.multicriteria.routeFileNames.resourceKey=src/app/**
