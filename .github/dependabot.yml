version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only propose versions published at least 7 days ago (lets bad releases get yanked first).
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # Expo SDK packages move together: upgrade them via `npx expo install expo@^<next> --fix`,
    # not one by one. Only patch/minor updates inside the current SDK are proposed here.
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      # Versioned with react-native itself (e.g. @react-native/eslint-plugin).
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
      # Toolchain coupled to the SDK: typescript-eslint (via eslint-config-expo) caps TypeScript,
      # jest-expo pins Jest. Bump majors with the SDK.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
    groups:
      expo-sdk:
        patterns: ['expo', 'expo-*', 'jest-expo', 'eslint-config-expo']
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['expo', 'expo-*', 'jest-expo', 'eslint-config-expo']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only propose versions published at least 7 days ago (lets bad releases get yanked first).
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
