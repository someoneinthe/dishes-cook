name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run manually to force an Android build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar blame / new-code detection
      - uses: ./.github/actions/setup-node-deps
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check
      - name: Database diagram up to date
        run: npm run db:diagram -- --check
      - name: Features page up to date
        run: npm run docs:features -- --check
      - run: npm run typecheck
      - run: npm run test:ci
      # The sync scenarios again, against a real PocketBase (server/pocketbase-version) started with
      # server/migrations: the fake server of the unit tests must keep behaving like the real one.
      - name: Sync tests against PocketBase
        run: npm run test:pocketbase
      - run: npm run doctor
      # The Android check builds a debug APK, which doesn't contain the JS bundle: bundle it here.
      - name: Bundle JS for Android (Metro)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
      # Secrets aren't available to Dependabot and fork PRs: skip the scan there.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  database-diagram:
    # Renders the database diagram image the release attaches, when the diagram or its rendering
    # changes: checks the rendering on the runner, and the image is the PR's artifact to look at.
    name: Database diagram image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Checkout, and the PR's changed files for paths-filter.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The renderer runs packages installed by npx: no token left in .git/config for them.
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: files
        with:
          filters: |
            diagram:
              - 'docs/database.md'
              - 'scripts/render-database-diagram.sh'
              - '.github/workflows/ci.yml'
      - if: steps.files.outputs.diagram == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.files.outputs.diagram == 'true'
        run: scripts/render-database-diagram.sh dist/database-diagram
      - if: steps.files.outputs.diagram == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-diagram
          path: dist/database-diagram/

  e2e:
    # Maestro flows (.maestro/) on an Android emulator, against an end-to-end build of the app (release,
    # x86_64, E2E_BUILD) and a throwaway sync server. Runs on main, and on PRs that change the app or
    # the flows; skipped (= passing) otherwise. See .maestro/README.md.
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Checkout, and the PR's changed files for paths-filter.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: files
        if: github.event_name == 'pull_request'
        with:
          filters: |
            app:
              - 'src/**'
              - 'assets/**'
              - 'plugins/**'
              - 'app.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'server/**'
              - '.maestro/**'
              - 'scripts/test-e2e.sh'
              - 'scripts/pocketbase-server.sh'
              - '.github/actions/build-android-apk/**'
              - '.github/workflows/ci.yml'
      - name: Decide whether to run
        id: run
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          TOUCHES_APP: ${{ steps.files.outputs.app }}
        run: |
          if [[ "$IS_PULL_REQUEST" != true || "$TOUCHES_APP" == true ]]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app change: end-to-end tests skipped."
          fi
      - if: steps.run.outputs.e2e == 'true'
        uses: ./.github/actions/setup-node-deps
      - if: steps.run.outputs.e2e == 'true'
        id: apk
        uses: ./.github/actions/build-android-apk
        env:
          E2E_BUILD: '1'
        with:
          architectures: x86_64
          output-name: dishes-cook-${{ github.sha }}-e2e.apk
          variant: release
      - name: Install Maestro
        if: steps.run.outputs.e2e == 'true'
        run: |
          version="$(tr -d '[:space:]' < .maestro/maestro-version)"
          release="https://github.com/mobile-dev-inc/maestro/releases/download/cli-$version"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --remote-name "$release/maestro.zip"
          curl --fail --silent --show-error --location --remote-name "$release/checksums_sha256.txt"
          grep ' maestro.zip$' checksums_sha256.txt | sha256sum --check --status
          unzip -q maestro.zip
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      # The Android emulator needs hardware acceleration (KVM) on the runner.
      - name: Enable KVM
        if: steps.run.outputs.e2e == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows on an emulator
        if: steps.run.outputs.e2e == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK: ${{ steps.apk.outputs.apk-path }}
        with:
          api-level: 34
          # A phone-sized screen like the local emulator's (the default one is much smaller).
          profile: pixel_6
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The launcher of a freshly booted emulator can freeze for a while ("isn't responding"):
          # let it settle on the home screen before the flows start.
          script: |
            adb install "$APK"
            adb shell input keyevent KEYCODE_HOME && sleep 20
            npm run test:e2e -- --format junit --output "$RUNNER_TEMP/maestro-report.xml" --test-output-dir "$RUNNER_TEMP/maestro-output" .maestro
      - name: Keep screenshots and logs of failed flows
        if: failure() && steps.run.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-output
          path: |
            ${{ runner.temp }}/maestro-output/
            ${{ runner.temp }}/maestro-report.xml

  changes:
    # Decides whether the Android build must run:
    # - on PRs, only if the PR touches a native input (otherwise its native fingerprint is main's,
    #   which main's own CI builds) — so docs/JS PRs never wait for main's post-merge build;
    # - and only for a native fingerprint (@expo/fingerprint) + build setup not built successfully
    #   yet on this branch or on main (cache marker).
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.cache-key }}
      is-built: ${{ steps.lookup.outputs.cache-hit }}
      touches-native: ${{ steps.native-files.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Files that can change the native fingerprint or the build itself (PR diff against its base).
      - name: Check whether the PR touches native inputs
        id: native-files
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            native:
              - 'package.json'
              - 'package-lock.json'
              - 'app.config.ts'
              - 'plugins/**'
              - 'assets/**'
              - '.github/actions/build-android-apk/**'
              - '.github/workflows/ci.yml'
      - uses: ./.github/actions/setup-node-deps
      - name: Compute native fingerprint
        id: key
        env:
          BUILD_ACTION_HASH: ${{ hashFiles('.github/actions/build-android-apk/**', '.github/workflows/ci.yml') }}
        run: |
          fingerprint="$(npx fingerprint fingerprint:generate --platform android | jq -r .hash)"
          echo "Android native fingerprint: $fingerprint"
          echo "cache-key=android-debug-arm64-$fingerprint-$BUILD_ACTION_HASH" >> "$GITHUB_OUTPUT"
      - name: Look up a previous successful build
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-build-ok
          key: ${{ steps.key.outputs.cache-key }}
          lookup-only: true

  android-build:
    # Skipped (= passing) when a PR touches no native input, or when this native fingerprint was
    # already built on this branch or on main. Run the workflow manually to force a build.
    name: Android build
    needs: [checks, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.is-built != 'true' &&
       (github.event_name != 'pull_request' || needs.changes.outputs.touches-native == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      # PR check: does the native project compile? Debug + one ABI is enough and ~2x faster;
      # the release workflow builds the full signed APK.
      - uses: ./.github/actions/build-android-apk
        with:
          architectures: arm64-v8a
          output-name: dishes-cook-${{ github.sha }}-debug.apk
          variant: debug
      - name: Record the successful build
        run: echo '${{ needs.changes.outputs.cache-key }}' > .android-build-ok
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-build-ok
          key: ${{ needs.changes.outputs.cache-key }}
