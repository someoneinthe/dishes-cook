name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run manually to force an Android build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar blame / new-code detection
      - uses: ./.github/actions/setup-node-deps
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run doctor
      # The Android check builds a debug APK, which doesn't contain the JS bundle: bundle it here.
      - name: Bundle JS for Android (Metro)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
      # Secrets aren't available to Dependabot and fork PRs: skip the scan there.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  changes:
    # Native fingerprint (@expo/fingerprint: native deps, config plugins, app config, native
    # assets) + the build action and this workflow. The Android build only runs for a combination that
    # hasn't been built successfully yet (cache marker), so JS-only changes and rebases skip it.
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.cache-key }}
      is-built: ${{ steps.lookup.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - name: Compute native fingerprint
        id: key
        env:
          BUILD_ACTION_HASH: ${{ hashFiles('.github/actions/build-android-apk/**', '.github/workflows/ci.yml') }}
        run: |
          fingerprint="$(npx fingerprint fingerprint:generate --platform android | jq -r .hash)"
          echo "Android native fingerprint: $fingerprint"
          echo "cache-key=android-debug-arm64-$fingerprint-$BUILD_ACTION_HASH" >> "$GITHUB_OUTPUT"
      - name: Look up a previous successful build
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-build-ok
          key: ${{ steps.key.outputs.cache-key }}
          lookup-only: true

  android-build:
    # Skipped (= passing) when this native fingerprint was already built on this branch or on main.
    # Run the workflow manually to force a build.
    name: Android build
    needs: [checks, changes]
    if: needs.changes.outputs.is-built != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      # PR check: does the native project compile? Debug + one ABI is enough and ~2x faster;
      # the release workflow builds the full signed APK.
      - uses: ./.github/actions/build-android-apk
        with:
          architectures: arm64-v8a
          output-name: dishes-cook-${{ github.sha }}-debug.apk
          variant: debug
      - name: Record the successful build
        run: echo '${{ needs.changes.outputs.cache-key }}' > .android-build-ok
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-build-ok
          key: ${{ needs.changes.outputs.cache-key }}
