name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run manually to force an Android build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar blame / new-code detection
      - uses: ./.github/actions/setup-node-deps
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run doctor
      # Secrets aren't available to Dependabot and fork PRs: skip the scan there.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            native:
              - 'package.json'
              - 'package-lock.json'
              - 'app.config.ts'
              - 'assets/**'
              - '.github/actions/build-android-apk/**'

  android-build:
    name: Android build
    needs: [checks, changes]
    if: needs.changes.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - uses: ./.github/actions/build-android-apk
        id: build
        with:
          output-name: dishes-cook-${{ github.sha }}.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: ${{ steps.build.outputs.apk-path }}
          retention-days: 7
